apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: d2c-web
    environment: dev
    team: d2c
  name: d2c-web
  namespace: d2c-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: d2c-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: d2c-web
        environment: dev
        team: d2c
    spec:
      containers:
        - env: []
          image: ghcr.io/akuity/guestbook@sha256:00ca33883ac6d18b7347a2a04d51fcf1e4fd09ef7404252333152543d68fe255
          name: d2c-web
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
