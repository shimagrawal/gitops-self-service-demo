apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: d2c-web
    environment: staging
    team: d2c
  name: d2c-web
  namespace: d2c-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: d2c-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: d2c-web
        environment: staging
        team: d2c
    spec:
      containers:
        - env: []
          image: ghcr.io/akuity/guestbook@sha256:faae7216af7e9b22e5a1f7961d9c3d89a4206727363b06f6eeb9622b00f7dc19
          name: d2c-web
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
