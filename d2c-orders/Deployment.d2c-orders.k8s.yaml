apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: d2c-orders
    environment: staging
    team: d2c
  name: d2c-orders
  namespace: d2c-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: d2c-orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: d2c-orders
        environment: staging
        team: d2c
    spec:
      containers:
        - env:
            - name: ORDERS_MODE
              value: demo
          image: ghcr.io/akuity/guestbook@sha256:faae7216af7e9b22e5a1f7961d9c3d89a4206727363b06f6eeb9622b00f7dc19
          name: d2c-orders
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
