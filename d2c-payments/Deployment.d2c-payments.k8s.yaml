apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: d2c-payments
    environment: dev
    team: d2c
  name: d2c-payments
  namespace: d2c-payments
spec:
  progressDeadlineSeconds: 30
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: d2c-payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: d2c-payments
        environment: dev
        team: d2c
    spec:
      containers:
        - env:
            - name: PAYMENTS_PROVIDER
              value: sandbox
          image: ghcr.io/akuity/guestbook@sha256:00ca33883ac6d18b7347a2a04d51fcf1e4fd09ef7404252333152543d68fe255
          name: d2c-payments
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: 2Mi
            requests:
              cpu: 50m
              memory: 2Mi
