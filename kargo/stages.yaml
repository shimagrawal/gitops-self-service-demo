# dev → staging → prod for every service of the team. Each Stage runs on the Kargo agent of the
# cluster it deploys to (shard).
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: d2c
  labels:
    kargo.akuity.io/shard: self-hosted
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: self-hosted
  requestedFreight:
  - origin:
      kind: Warehouse
      name: d2c
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deploy
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: d2c
  labels:
    kargo.akuity.io/shard: self-hosted-uat
  annotations:
    kargo.akuity.io/color: amber
spec:
  shard: self-hosted-uat
  requestedFreight:
  - origin:
      kind: Warehouse
      name: d2c
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      steps:
      - task:
          name: deploy
  # A failed smoke test marks the Freight unverified (it cannot reach prod) and triggers the
  # auto-rollback configured in the ProjectConfig.
  verification:
    analysisTemplates:
    - name: smoke-test
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: d2c
  labels:
    kargo.akuity.io/shard: self-hosted-prod
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: self-hosted-prod
  requestedFreight:
  - origin:
      kind: Warehouse
      name: d2c
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      steps:
      # Developers can promote, but only the release approver can let it through.
      - uses: wait-for-approval
        as: approve
        config:
          minApprovals: 1
          approvers:
          - claim: email
            value: shivam.agrawal@akuity.io
            required: true
      - uses: record-audit-event
        config:
          type: approved
          actor: ${{ outputs['approve'].responses[0].user }}
          message: Release ${{ ctx.targetFreight.name }} approved for ${{ ctx.stage }}
          data:
            freight: ${{ ctx.targetFreight.name }}
      - task:
          name: deploy
      - uses: record-audit-event
        config:
          type: deployed
          message: Release ${{ ctx.targetFreight.name }} deployed to ${{ ctx.stage }}
          data:
            freight: ${{ ctx.targetFreight.name }}
